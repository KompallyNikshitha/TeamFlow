
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamFlow - Employees</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f4f5fb;
            margin: 0;
            padding: 30px;
            color: #252b45;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 { color: #343a70; }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            background: #575fcf;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th { background: #eef0ff; }

        a {
            color: #575fcf;
            text-decoration: none;
            margin-right: 10px;
        }

        .delete { color: #e05252; }

        .back {
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
<div class="container">

    <a class="back" th:href="@{/}">← Back to Dashboard</a>

    <h1>Employee Management</h1>
    <p>Manage your TeamFlow team members.</p>

    <div class="card">
        <h2>Add New Employee</h2>

        <form th:action="@{/employees/add}"
              th:object="${employee}" method="post">

            <label>Employee Name</label>
            <input type="text" th:field="*{name}"
                   placeholder="Enter employee name" required>

            <label>Email Address</label>
            <input type="email" th:field="*{email}"
                   placeholder="Enter email address" required>

            <label>Role</label>
            <select th:field="*{role}" required>
                <option value="">Select Role</option>
                <option value="Project Manager">Project Manager</option>
                <option value="Developer">Developer</option>
                <option value="Designer">Designer</option>
                <option value="Tester">Tester</option>
                <option value="Team Member">Team Member</option>
            </select>

            <button type="submit">Add Employee</button>
        </form>
    </div>

    <div class="card">
        <h2>Team Members</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.name}"></td>
                    <td th:text="${emp.email}"></td>
                    <td th:text="${emp.role}"></td>
                    <td>
                        <a th:href="@{/employees/edit/{id}(id=${emp.id})}">
                            Edit
                        </a>

                        <a class="delete"
                           th:href="@{/employees/delete/{id}(id=${emp.id})}"
                           onclick="return confirm('Delete this employee?')">
                            Delete
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="5">No employees added yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
