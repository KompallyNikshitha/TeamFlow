
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TeamFlow Registration</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .register-box {
            background: white;
            width: 420px;
            max-width: 90%;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 30px #0003;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        input, button {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border-radius: 7px;
        }

        input {
            border: 1px solid #cbd5e1;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: red;
            text-align: center;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h1>TeamFlow</h1>

    <p class="subtitle">
        Create Your Account
    </p>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/register}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <input type="text"
               name="username"
               placeholder="Enter username"
               required>

        <input type="password"
               name="password"
               placeholder="Create password (minimum 8 characters)"
               minlength="8"
               required>

        <button type="submit">Create Account</button>

    </form>

    <div class="login-link">
        Already have an account?
        <a th:href="@{/login}">Sign In</a>
    </div>

</div>

</body>
</html>
