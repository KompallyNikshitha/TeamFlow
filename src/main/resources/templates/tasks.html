
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamFlow - Tasks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f5fb;
            margin: 0;
            color: #252744;
        }

        header {
            background: #5146d8;
            color: white;
            padding: 20px 35px;
        }

        main {
            padding: 35px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px #00000010;
        }

        input, select, button {
            padding: 12px;
            margin: 8px 5px 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            background: #5146d8;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #3930ad;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            color: #5146d8;
        }

        a {
            color: #5146d8;
            text-decoration: none;
        }

        .edit {
            color: #198754;
            margin-right: 12px;
            font-weight: bold;
        }

        .delete {
            color: #dc3545;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            background: #5146d8;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .priority-high {
            color: #dc3545;
            font-weight: bold;
        }

        .priority-medium {
            color: #d97706;
            font-weight: bold;
        }

        .priority-low {
            color: #198754;
            font-weight: bold;
        }

        @media(max-width:700px) {
            .panel {
                overflow-x: auto;
            }

            table {
                min-width: 1050px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>TeamFlow</h1>
    <p>Task Management</p>
</header>

<main>

    <h2>Manage Your Tasks</h2>

    <a href="/" class="back">Back to Dashboard</a>

    <div class="panel">

        <h3>Create New Task</h3>

        <form th:action="@{/tasks/add}"
              th:object="${newTask}"
              method="post">

            <input type="text"
                   th:field="*{title}"
                   placeholder="Task Title"
                   required>

            <input type="text"
                   th:field="*{description}"
                   placeholder="Task Description">

            <select th:field="*{status}" required>
                <option value="To Do">To Do</option>
                <option value="In Progress">In Progress</option>
                <option value="In Review">In Review</option>
                <option value="Completed">Completed</option>
            </select>

            <select th:field="*{priority}" required>
                <option value="High">High Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="Low">Low Priority</option>
            </select>

            <input type="date" th:field="*{deadline}">

            <select name="projectId" required>
                <option value="">Select Project</option>
                <option th:each="project : ${projects}"
                        th:value="${project.id}"
                        th:text="${project.name}">
                </option>
            </select>

            <select name="employeeId">
                <option value="">Select Employee (Optional)</option>
                <option th:each="employee : ${employees}"
                        th:value="${employee.id}"
                        th:text="${employee.name}">
                </option>
            </select>

            <button type="submit">Add Task</button>

        </form>

    </div>

    <div class="panel">

        <h3>All Tasks</h3>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Task</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Deadline</th>
                    <th>Project</th>
                    <th>Assigned Employee</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="task : ${tasks}">

                    <td th:text="${task.id}"></td>

                    <td th:text="${task.title}"></td>

                    <td th:text="${task.description}"></td>

                    <td th:text="${task.status}"></td>

                    <td>
                        <span th:text="${task.priority}"
                              th:class="${task.priority == 'High' ? 'priority-high' :
                                         (task.priority == 'Low' ? 'priority-low' : 'priority-medium')}">
                        </span>
                    </td>

                    <td th:text="${task.deadline}"></td>

                    <td th:text="${task.project != null ? task.project.name : 'Not assigned'}"></td>

                    <td th:text="${task.employee != null ? task.employee.name : 'Not assigned'}"></td>

                    <td>
                        <a class="edit"
                           th:href="@{/tasks/edit/{id}(id=${task.id})}">
                            Edit
                        </a>

                        <a class="delete"
                           th:href="@{/tasks/delete/{id}(id=${task.id})}"
                           onclick="return confirm('Delete this task?')">
                            Delete
                        </a>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(tasks)}">
                    <td colspan="9">
                        No tasks available. Create your first task!
                    </td>
                </tr>

            </tbody>
        </table>

    </div>

</main>

</body>
</html>
