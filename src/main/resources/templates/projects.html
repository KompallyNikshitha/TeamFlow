
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TeamFlow - Projects</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f5fb;
            margin: 0;
            color: #252744;
        }

        header {
            background: #5146d8;
            color: white;
            padding: 20px 35px;
        }

        header h1 {
            margin: 0;
        }

        main {
            padding: 35px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px #00000010;
        }

        input, select, button {
            padding: 12px;
            margin: 8px 5px 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            background: #5146d8;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #3930a8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            color: #5146d8;
        }

        a {
            color: #5146d8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .action-link {
            font-weight: bold;
        }

        .delete-link {
            color: #dc3545;
        }

        .dashboard-link {
            display: inline-block;
            background: #5146d8;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .dashboard-link:hover {
            background: #3930a8;
            text-decoration: none;
        }

        .empty-message {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        @media (max-width: 700px) {
            main {
                padding: 15px;
            }

            .panel {
                overflow-x: auto;
            }

            table {
                min-width: 650px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>TeamFlow</h1>
    <p>Project Management & Team Collaboration</p>
</header>

<main>

    <h2>Manage Your Projects</h2>

    <a href="/" class="dashboard-link">
        Back to Dashboard
    </a>

    <!-- ADD PROJECT FORM -->

    <div class="panel">

        <h3>Add New Project</h3>

        <form th:action="@{/projects/add}"
              th:object="${newProject}"
              method="post">

            <input type="text"
                   th:field="*{name}"
                   placeholder="Project Name"
                   required>

            <input type="text"
                   th:field="*{description}"
                   placeholder="Description">

            <select th:field="*{status}">
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>

            <input type="date"
                   th:field="*{deadline}">

            <button type="submit">
                Add Project
            </button>

        </form>

    </div>

    <!-- PROJECT TABLE -->

    <div class="panel">

        <h3>All Projects</h3>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Project Name</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Deadline</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="project : ${projects}">

                    <td th:text="${project.id}"></td>

                    <td th:text="${project.name}"></td>

                    <td th:text="${project.description}"></td>

                    <td th:text="${project.status}"></td>

                    <td th:text="${project.deadline}"></td>

                    <td>

                        <a class="action-link"
   th:href="@{/projects/edit/{id}(id=${project.id})}">
    Edit
</a>

                        &nbsp; | &nbsp;

                        <a class="action-link delete-link"
                           th:href="@{/projects/delete/{id}(id=${project.id})}"
                           onclick="return confirm('Are you sure you want to delete this project?')">
                            Delete
                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(projects)}">
                    <td colspan="6" class="empty-message">
                        No projects available. Add your first project!
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
