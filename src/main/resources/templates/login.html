
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TeamFlow Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 360px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 30px #0003;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        input, button {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border-radius: 7px;
        }

        input {
            border: 1px solid #cbd5e1;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .error {
            color: red;
            text-align: center;
        }

        .success {
            color: green;
            text-align: center;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
<div class="login-box">

    <h1>TeamFlow</h1>
    <p class="subtitle">Project Management & Team Collaboration</p>

    <p class="error" th:if="${param.error}">
        Invalid username or password.
    </p>

    <p class="success" th:if="${param.logout}">
        Logged out successfully.
    </p>

    <p class="success" th:if="${success}" th:text="${success}"></p>

    <form th:action="@{/login}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <input type="text"
               name="username"
               placeholder="Enter username"
               required>

        <input type="password"
               name="password"
               placeholder="Enter password"
               required>

        <button type="submit">Sign In</button>
    </form>

    <div class="register-link">
        New to TeamFlow?
        <a th:href="@{/register}">Create Account</a>
    </div>

</div>
</body>
</html>
